[project]
name = "loopeng"
version = "0.1.0"
description = "Four nested agent loops over a text-to-SQL agent, built to show the gap between a rule declared in config and a rule something enforces"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Animesh Kumar", email = "44803072+ANI-IN@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    # The judge only. Kept a first-class dependency rather than an extra: the judge
    # is required, so a checkout that cannot import this cannot run a session.
    "anthropic>=0.120.2",
    # The agent and the reference arm — the two roles that produce every measured
    # number. See src/loopeng/registry.py for why the split is what it is.
    "openai>=2.14.0",
    "duckdb>=1.5.5",
    "gradio>=6.20.0",
    "langsmith>=0.10.11",
    # Floor kept from when committed PNGs existed: >=3.10 was the declared contract and
    # 3.11.0 replaced matplotlib's entire text rendering stack, so the contract permitted
    # a renderer the frozen images could not survive while the byte-identity test SKIPPED
    # rather than failed. Green suite, unreproducible images. The images, their manifest
    # and that test have all since been removed — every chart is drawn by the run that
    # renders it — so nothing depends on byte identity any more. The floor stays because
    # the charts are built against this API, not to protect files that no longer exist.
    "matplotlib>=3.11.1",
    # Imported directly by src/loopeng/settings.py (SecretStr, ValidationError). It
    # resolved anyway as a transitive of pydantic-settings, which is why nothing failed
    # and why it went undeclared for so long: a dependency that arrives by accident is
    # indistinguishable from one that was asked for, until the accident stops.
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "sqlglot>=30.14.0",
    "structlog>=26.1.0",
    "langchain-core>=1.6.2",
]

# OPTIONAL, and deliberately not a default dependency.
#
# `notebooks/` needs a kernel to run in; nothing else in this repository does. Every
# other path — the demos, the sweep, the views, the whole offline suite — runs without
# it, and CI installs the default set only, so the zero-key zero-network property of
# the offline job is not weakened by a notebook that a reader may never open.
#
#     uv sync --extra notebooks
#     uv run --extra notebooks jupyter lab notebooks/
[project.optional-dependencies]
notebooks = ["jupyterlab>=4.5.0"]

# Added at migration. The package carried no repository URL at all, so a wheel or
# sdist built from it pointed nowhere — an artifact with no way back to its source.
[project.urls]
Homepage = "https://github.com/ANI-IN/loop-engineering"
Repository = "https://github.com/ANI-IN/loop-engineering"
Issues = "https://github.com/ANI-IN/loop-engineering/issues"

[build-system]
# <0.13 rather than <0.12.0. The uv 0.12 release notes address this cap by name:
# "There are no breaking changes to the configuration of the uv build backend. If
# your [build-system] table includes an upper bound on uv_build, update it to allow
# uv_build 0.12."
requires = ["uv_build>=0.11.20,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Both vendors' transports, for scripted error responses in tests/fakes.py.
    # The two SDKs are on DIFFERENT major versions of the same library — anthropic
    # on httpx, openai on httpx2 — and an error object built with the wrong one is
    # rejected by the SDK's constructor. Declared explicitly rather than left to
    # resolve transitively: the suite would otherwise depend on two other packages'
    # dependency choices staying still, and they have already diverged once.
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the network and costs money; deselected by default",
]
# The default suite must be runnable with no keys and no network. Opting in to
# live tests is an explicit act: `pytest -m live`.
addopts = "-m 'not live'"

# A hung test must fail loudly, naming itself.
#
# One CI run was cancelled at the job timeout after sitting at 63% for nine
# minutes, and the log said nothing about which test was stuck — the whole job
# just stopped. A suite that can consume its budget and report nothing is the
# same defect this project is about: a check that produces no evidence.
#
# 300s is deliberately generous. The slowest honest test here spawns a nested
# pytest, and a cold CI runner rebuilding matplotlib's font cache adds real time
# on top. This is a backstop against a hang, not a performance budget.
timeout = 300
timeout_method = "thread"
