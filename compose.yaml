# DataPilot services. `make up` starts them; `make down` stops them. Needs Docker Engine and the
# Compose plugin (setup/ lists free options on every system).
name: datapilot

x-app: &app
  build:
    context: .
    dockerfile: platform/ops/docker/Dockerfile
  image: datapilot:local
  env_file:
    - path: .env
      required: false
  # Inside a container, localhost is the container itself, so the services reach Postgres by
  # service name. The ops tables stay on the Compose Postgres; the agent's two databases come from
  # SERVICES_DATABASE_URL_AGENT and SERVICES_DATABASE_URL_AGENT_ALT in .env when set (.env.example).
  environment:
    DATABASE_URL_OWNER: postgresql://datapilot_owner:datapilot_owner@postgres:5432/datapilot
    DATABASE_URL_APP: postgresql://datapilot_app:datapilot_app@postgres:5432/datapilot
    DATABASE_URL_AGENT: ${SERVICES_DATABASE_URL_AGENT:-postgresql://datapilot_agent_ro:datapilot_agent_ro@postgres:5432/datapilot}
    DATABASE_URL_AGENT_ALT: ${SERVICES_DATABASE_URL_AGENT_ALT:-postgresql://datapilot_agent_ro:datapilot_agent_ro@postgres:5432/warehouse_alt}
    DATAPILOT_API_URL: http://api:8000
    DATAPILOT_SPEND_LEDGER: /home/datapilot/.datapilot/spend-ledger.sqlite
  volumes:
    # The build-wide spend ledger, shared with live work on the host (make spend reads it).
    - ${HOME}/.datapilot:/home/datapilot/.datapilot
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_PASSWORD: postgres  # the local superuser; only the init script uses it
    # Every published port listens on this machine only (127.0.0.1): the superuser password is
    # "postgres", and the api and the console have no sign-in, so no other machine may reach them.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./platform/ops/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datapilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["datapilot", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "datapilot.loop3_events.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["datapilot", "worker"]

  scheduler:
    <<: *app
    command: ["datapilot", "scheduler"]

  # Serves the Improve page: experiments, the analyzer team, promotions, and gold checks.
  hill-climbing-runner:
    <<: *app
    command: ["datapilot", "hill-climbing-runner"]

  console:
    <<: *app
    working_dir: /app/platform/console
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8501}:8501"

volumes:
  pgdata:
