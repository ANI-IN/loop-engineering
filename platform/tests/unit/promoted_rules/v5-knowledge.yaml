version: v5
rules:
- id: money-in-cents
  title: Money in cents
  rule_text: Money columns hold whole cents. Report money in dollars, divided by 100
    and rounded to two decimals.
  applies_when: a question asks for an amount of money
  sql_guidance: round(sum(<cents column>) / 100.0, 2)
- id: eligible-business-orders
  title: Use the eligible business-order population
  rule_text: For standard business order, revenue, and customer-activity metrics,
    exclude status-5 orders and orders belonging to Harbor Pine internal customers.
    Include other order statuses unless the request defines a different population.
  applies_when: a standard business metric is based on orders or customers with order
    activity
  sql_guidance: status <> 5 AND <documented non-internal-customer predicate>
- id: new-york-local-order-dates
  title: Use New York local dates for order analytics
  rule_text: Interpret order timestamps, date boundaries, and date-based groupings
    in New York local time when the analysis is based on business dates or reporting
    periods.
  applies_when: an order metric uses calendar dates, weekdays, named dates, or reporting-period
    boundaries
  sql_guidance: convert timestamp to America/New_York before date extraction or filtering
- id: february-january-fiscal-year
  title: Apply the February-to-January fiscal year
  rule_text: A fiscal year runs from February 1 through January 31 and is labeled
    by the calendar year in which it ends. For example, fiscal 2025 spans February
    1, 2024 through January 31, 2025.
  applies_when: a request specifies a fiscal year
  sql_guidance: filter local dates with start-inclusive and end-exclusive bounds
- id: fiscal-quarter-months
  title: Derive quarters within the fiscal year
  rule_text: 'Number fiscal quarters from the February fiscal-year start: Q1 is February–April,
    Q2 May–July, Q3 August–October, and Q4 November–January.'
  applies_when: a request groups or filters results by fiscal quarter
  sql_guidance: derive fiscal quarter from New York local month and fiscal-year start
- id: parent-category-grouping
  title: Group products by their parent category
  rule_text: When a top-level category is requested, use the product category's parent
    category. Do not substitute the product's directly assigned category when no parent
    exists.
  applies_when: a product metric groups or filters by top-level category
  sql_guidance: join through the assigned category's parent
- id: first-order-among-eligible-orders
  title: Determine new-customer status from eligible orders
  rule_text: For new-customer cohorts, determine each customer's first order using
    only eligible business orders, then assign the customer to a cohort based on that
    first eligible order date.
  applies_when: a request identifies new customers or customers by first-order date
  sql_guidance: filter eligible orders before MIN(order date) per customer
- id: net-revenue-order-value
  title: Calculate average order value from net revenue
  rule_text: For average order value, calculate each eligible order's net amount as
    subtotal less discount, then average those amounts; do not average total_cents.
  applies_when: a request asks for average order value
  sql_guidance: Compute subtotal - discount per eligible order, then take AVG of that
    amount.
- id: signed-revenue-growth
  title: Preserve the direction of revenue growth
  rule_text: Calculate growth as a signed change from the comparison period; do not
    take the absolute value, since a decline must remain negative.
  applies_when: a request compares revenue across periods and asks for growth or change
  sql_guidance: (current - prior) / prior
- id: requested-output-shape
  title: Return only requested result fields
  rule_text: Return the requested measures and dimensions without adding unrequested
    columns.
  applies_when: a request specifies a metric or output grouping
  sql_guidance: select only requested dimensions and measures
notes: Analyzer team draft from 20 failed dev items over v1.

