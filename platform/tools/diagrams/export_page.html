<!doctype html>
<!--
  The diagram export page (authoring time only). export_diagrams.py opens it in headless Chromium
  through Playwright for Python. It loads one pinned Excalidraw build from jsDelivr and exposes
  three calls on window.diagrams: ready (a promise), measure, and render (a scene and its
  options: the PNG scale, and whether to make the SVG).
  The version below must equal EXCALIDRAW_VERSION in export_diagrams.py; the script checks it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagram export</title>
<script>
  window.EXCALIDRAW_VERSION = "0.18.1";
  // Fonts load from the same pinned package, never from a moving default.
  window.EXCALIDRAW_ASSET_PATH =
    "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@" + window.EXCALIDRAW_VERSION + "/dist/prod/";
</script>
</head>
<body>
<script type="module">
  const url = "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@" + window.EXCALIDRAW_VERSION + "/+esm";
  const fontNames = { 5: "Excalifont", 6: "Nunito", 8: "Comic Shanns", 1: "Virgil", 2: "Helvetica", 3: "Cascadia" };

  async function boot() {
    const lib = await import(url);
    // A first export registers and loads the fonts the scene uses (Nunito for labels, Comic
    // Shanns for code, Excalifont for older sources), so measure() sees real metrics.
    const warm = [5, 6, 8].map((family, i) => ({
      type: "text", id: "warm-" + family, x: 0, y: i * 40, width: 10, height: 10,
      text: "Warm up 0123", originalText: "Warm up 0123", fontSize: 20, fontFamily: family,
      textAlign: "left", verticalAlign: "top", lineHeight: 1.25, strokeColor: "#000000",
      backgroundColor: "transparent", fillStyle: "solid", strokeWidth: 1, strokeStyle: "solid",
      roughness: 0, opacity: 100, angle: 0, seed: 1 + i, version: 1, versionNonce: 1,
      isDeleted: false, groupIds: [], frameId: null, boundElements: null, updated: 1, link: null,
      locked: false, containerId: null, autoResize: true, roundness: null, index: "a" + i,
    }));
    await lib.exportToSvg({ elements: warm, appState: { exportBackground: false }, files: {} });
    await document.fonts.ready;
    for (const family of ["Excalifont", "Nunito", "Comic Shanns"]) {
      await document.fonts.load(`20px "${family}"`);
      if (!document.fonts.check(`20px "${family}"`)) throw new Error(`the font ${family} did not load`);
    }
    return lib;
  }

  const ready = boot();

  // Width and height of each label, measured with the loaded font, the way Excalidraw lays out
  // text: the widest line, and lines times font size times line height.
  async function measure(items) {
    await ready;
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    return items.map((item) => {
      const family = fontNames[item.fontFamily] || "Excalifont";
      context.font = `${item.fontSize}px "${family}"`;
      const lines = item.text.split("\n");
      const width = Math.max(...lines.map((line) => context.measureText(line).width));
      return { width, height: lines.length * item.fontSize * item.lineHeight };
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // One scene in; out: the PNG at the given scale (base64) and, unless options.svg is false, the
  // SVG text with its fonts embedded. Pages use scale 2 with the SVG; the deck uses scale 3.
  async function render(scene, options) {
    const lib = await ready;
    const scale = (options && options.scale) || 2;
    const wantSvg = !options || options.svg !== false;
    const elements = scene.elements.filter((element) => !element.isDeleted);
    const appState = {
      ...(scene.appState || {}),
      exportBackground: false,
      exportWithDarkMode: false,
      exportEmbedScene: false,
    };
    const files = scene.files || {};
    const svg = wantSvg ? await lib.exportToSvg({ elements, appState, files, exportPadding: 0 }) : null;
    // This build takes the PNG's scale from getDimensions; appState.exportScale alone is ignored
    // (the renders before 26 October 2026 came out at scale 1 for that reason).
    const blob = await lib.exportToBlob({
      elements,
      appState: { ...appState, exportScale: scale },
      files,
      exportPadding: 0,
      mimeType: "image/png",
      getDimensions: (width, height) => ({ width: width * scale, height: height * scale, scale }),
    });
    return {
      svg: svg ? svg.outerHTML : "",
      png: await blobToBase64(blob),
      embeddedFonts: svg ? (svg.outerHTML.match(/@font-face/g) || []).length : 0,
    };
  }

  window.diagrams = { ready: ready.then(() => window.EXCALIDRAW_VERSION), measure, render };
</script>
</body>
</html>
