# Knowledge version v2-overbroad: a demo aid (planted item knowledge-v2-overbroad). It adds one
# plausible but over-broad rule to v1. Discounted orders are real sales, so the rule changes every
# revenue answer it touches; the promotion gate blocks the version, for no holdout improvement
# against v1 and for regressions against any version that already answers revenue correctly.
version: v2-overbroad
notes: v1 plus one over-broad revenue rule, to show the gate blocking a plausible change.
rules:
  - id: money-in-cents
    title: Money in cents
    rule_text: >-
      Money columns hold whole cents. Report money in dollars, divided by 100 and rounded to two
      decimals.
    applies_when: a question asks for an amount of money
    sql_guidance: round(sum(<cents column>) / 100.0, 2)
  - id: exclude-discounted-orders
    title: Exclude discounted orders from revenue
    rule_text: >-
      Orders with a discount are promotional and distort revenue, so exclude discounted orders
      from revenue.
    applies_when: a question asks for revenue, sales, or average order value
    sql_guidance: WHERE o.discount_cents = 0
