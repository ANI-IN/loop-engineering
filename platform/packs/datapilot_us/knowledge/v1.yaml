# Knowledge version v1: the near-empty starting knowledge (planted item knowledge-v1-empty).
# It states only how money is stored. Every trap is left for the hill-climbing loop to learn.
version: v1
notes: The starting knowledge. Only the money rule; no business definitions yet.
rules:
  - id: money-in-cents
    title: Money in cents
    rule_text: >-
      Money columns hold whole cents. Report money in dollars, divided by 100 and rounded to two
      decimals.
    applies_when: a question asks for an amount of money
    sql_guidance: round(sum(<cents column>) / 100.0, 2)
