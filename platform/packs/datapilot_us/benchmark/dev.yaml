- id: net-revenue-by-quarter-fiscal-2025
  question: >-
    What was net revenue in each quarter of fiscal year 2025, in dollars? Give the quarter
    number and the revenue, in quarter order.
  split: dev
  category: fiscal_periods
  difficulty: 3
  metric_family: revenue
  order_matters: true
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: by-fiscal-quarter
  gold_sql: |
    SELECT (extract(month FROM (o.order_ts AT TIME ZONE 'America/New_York') - interval '1 month')::int - 1) / 3 + 1 AS fiscal_quarter,
           round(sum(o.subtotal_cents - o.discount_cents) / 100.0, 2) AS net_revenue
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-02-01'
    GROUP BY fiscal_quarter
    ORDER BY fiscal_quarter
  naive_sql: |
    SELECT extract(quarter FROM order_ts) AS quarter, round(sum(total_cents) / 100.0, 2)
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2025
    GROUP BY quarter
    ORDER BY quarter

