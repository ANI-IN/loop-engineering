- id: net-revenue-growth-fiscal-2026
  question: >-
    By what percentage did net revenue grow from fiscal year 2025 to fiscal year 2026? Round to
    one decimal place.
  split: dev
  category: ratios
  difficulty: 3
  metric_family: revenue
  numeric_tolerance: 0.1
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts]
  paraphrase_group: revenue-growth
  gold_sql: |
    WITH by_year AS (
        SELECT CASE WHEN (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-02-01'
                    THEN 2025 ELSE 2026 END AS fiscal_year,
               sum(o.subtotal_cents - o.discount_cents) AS net_cents
        FROM warehouse.orders o
        JOIN warehouse.customers c ON c.customer_id = o.customer_id
        WHERE o.status <> 5
          AND lower(c.email) NOT LIKE '%@harborpine.com'
          AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-02-01'
          AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
        GROUP BY fiscal_year
    )
    SELECT round(100.0 * (max(net_cents) FILTER (WHERE fiscal_year = 2026)
                          - max(net_cents) FILTER (WHERE fiscal_year = 2025))
                 / max(net_cents) FILTER (WHERE fiscal_year = 2025), 1) AS growth_percent
    FROM by_year
  naive_sql: |
    SELECT round(100.0 * (sum(total_cents) FILTER (WHERE extract(year FROM order_ts) = 2026)
                          - sum(total_cents) FILTER (WHERE extract(year FROM order_ts) = 2025))
                 / sum(total_cents) FILTER (WHERE extract(year FROM order_ts) = 2025), 1)
    FROM warehouse.orders
