# Benchmark, dev split: 25 items. The analyzer team may read these; it never reads the holdout.
# Schema: datapilot.contracts.evaluation.BenchmarkItem. Gold SQL follows business_rules.md; each
# naive_sql is the answer a model without the business rules would give, and the trap-sensitivity
# tests prove it returns a different result than gold on both warehouses.
# Traps: fiscal_year, net_revenue, cancelled_orders, eastern_time, internal_accounts.

- id: product-count
  question: How many products are in the catalog?
  split: dev
  category: simple_aggregates
  difficulty: 1
  metric_family: products
  gold_sql: SELECT count(*) FROM warehouse.products

- id: texas-customers
  question: How many customers live in Texas?
  split: dev
  category: simple_aggregates
  difficulty: 1
  metric_family: customers
  gold_sql: |
    SELECT count(*)
    FROM warehouse.customers c
    WHERE c.state = 'TX'
      AND lower(c.email) NOT LIKE '%@harborpine.com'

- id: net-revenue-calendar-2024
  question: What was our net revenue in calendar year 2024, in dollars?
  split: dev
  category: simple_aggregates
  difficulty: 2
  metric_family: revenue
  traps: [net_revenue, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: net-revenue-period
  gold_sql: |
    SELECT round(sum(o.subtotal_cents - o.discount_cents) / 100.0, 2) AS net_revenue
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-01-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-01-01'
  naive_sql: |
    SELECT round(sum(total_cents) / 100.0, 2)
    FROM warehouse.orders
    WHERE order_ts >= '2024-01-01' AND order_ts < '2025-01-01'

- id: app-orders-calendar-2025
  question: How many orders did we receive through the app channel in calendar year 2025?
  split: dev
  category: simple_aggregates
  difficulty: 2
  metric_family: orders
  traps: [cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: channel-orders-calendar-year
  gold_sql: |
    SELECT count(*)
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.channel = 'app'
      AND o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-01-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-01-01'
  naive_sql: |
    SELECT count(*)
    FROM warehouse.orders
    WHERE channel = 'app' AND extract(year FROM order_ts) = 2025

- id: active-products-by-category
  question: >-
    How many active products are in each top-level category? Give the category name and the
    count.
  split: dev
  category: joins_and_hierarchy
  difficulty: 2
  metric_family: products
  paraphrase_group: products-by-category
  gold_sql: |
    SELECT top.name AS category, count(*) AS active_products
    FROM warehouse.products p
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    WHERE p.is_active
    GROUP BY top.name

- id: units-by-category-fiscal-2025
  question: >-
    How many units did we sell in each top-level category in fiscal year 2025? Give the
    category name and the units.
  split: dev
  category: joins_and_hierarchy
  difficulty: 3
  metric_family: products
  traps: [fiscal_year, cancelled_orders, internal_accounts]
  paraphrase_group: units-by-category
  gold_sql: |
    SELECT top.name AS category, sum(oi.quantity) AS units
    FROM warehouse.order_items oi
    JOIN warehouse.orders o ON o.order_id = oi.order_id
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    JOIN warehouse.products p ON p.product_id = oi.product_id
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-02-01'
    GROUP BY top.name
  naive_sql: |
    SELECT top.name, sum(oi.quantity)
    FROM warehouse.order_items oi
    JOIN warehouse.orders o ON o.order_id = oi.order_id
    JOIN warehouse.products p ON p.product_id = oi.product_id
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    WHERE extract(year FROM o.order_ts) = 2025
    GROUP BY top.name

- id: camping-subcategories
  question: Which subcategories sit under the Camping category?
