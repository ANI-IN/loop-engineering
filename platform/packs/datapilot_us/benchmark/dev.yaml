- id: busiest-day-fiscal-2025
  question: >-
    On which date in fiscal year 2025 did we have the most orders? Give the date and the number
    of orders.
  split: dev
  category: eastern_business_days
  difficulty: 3
  metric_family: orders
  traps: [eastern_time, fiscal_year, cancelled_orders, internal_accounts]
  gold_sql: |
    SELECT (o.order_ts AT TIME ZONE 'America/New_York')::date AS order_date, count(*) AS orders
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-02-01'
    GROUP BY order_date
    ORDER BY orders DESC, order_date
    LIMIT 1
  naive_sql: |
    SELECT order_ts::date AS order_date, count(*) AS orders
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2025
    GROUP BY order_date
    ORDER BY orders DESC, order_date
    LIMIT 1

