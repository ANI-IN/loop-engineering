- id: new-customers-fiscal-2026
  question: How many shoppers made their very first purchase with us during fiscal year 2026?
  split: holdout
  category: customer_segments
  difficulty: 3
  metric_family: customers
  traps: [fiscal_year, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: first-order-customers
  gold_sql: |
    WITH firsts AS (
        SELECT o.customer_id, min(o.order_ts AT TIME ZONE 'America/New_York') AS first_order
        FROM warehouse.orders o
        JOIN warehouse.customers c ON c.customer_id = o.customer_id
        WHERE o.status <> 5
          AND lower(c.email) NOT LIKE '%@harborpine.com'
        GROUP BY o.customer_id
    )
    SELECT count(*)
    FROM firsts
    WHERE first_order >= DATE '2025-02-01' AND first_order < DATE '2026-02-01'
  naive_sql: |
    SELECT count(*)
    FROM (SELECT customer_id, min(order_ts) AS first_order
          FROM warehouse.orders GROUP BY customer_id) f
    WHERE extract(year FROM first_order) = 2026

- id: top-customers-fiscal-2026
  question: >-
    List the ten biggest-spending shoppers of fiscal year 2026 by customer id, with what each
    spent in net revenue dollars, from the top down.
  split: holdout
  category: ranking
  difficulty: 3
  metric_family: customers
  order_matters: true
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts]
  paraphrase_group: top-customers
  gold_sql: |
    SELECT o.customer_id, round(sum(o.subtotal_cents - o.discount_cents) / 100.0, 2) AS net_revenue
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
    GROUP BY o.customer_id
    ORDER BY net_revenue DESC, o.customer_id
    LIMIT 10
  naive_sql: |
    SELECT customer_id, round(sum(total_cents) / 100.0, 2) AS revenue
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2026
    GROUP BY customer_id
    ORDER BY revenue DESC, customer_id
    LIMIT 10

- id: bottom-states-net-revenue-fiscal-2026
  question: >-
    Name the three destination states that generated the least net revenue in fiscal year 2026,
    with the dollar amounts, smallest first.
  split: holdout
  category: ranking
  difficulty: 3
  metric_family: revenue
  order_matters: true
  traps: [fiscal_year, net_revenue, cancelled_orders]
  paraphrase_group: states-by-revenue
  gold_sql: |
    SELECT o.ship_state, round(sum(o.subtotal_cents - o.discount_cents) / 100.0, 2) AS net_revenue
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
    GROUP BY o.ship_state
    ORDER BY net_revenue, o.ship_state
    LIMIT 3
  naive_sql: |
    SELECT ship_state, round(sum(total_cents) / 100.0, 2) AS revenue
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2026
    GROUP BY ship_state
    ORDER BY revenue, ship_state
    LIMIT 3

- id: app-average-order-value-fiscal-2026
  question: >-
    For purchases made in our app this fiscal year, what was the typical basket in dollars,
    measured as average order value?
  split: holdout
  category: ratios
  difficulty: 2
  metric_family: aov
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts]
  paraphrase_group: average-order-value
  gold_sql: |
    SELECT round(sum(o.subtotal_cents - o.discount_cents) / 100.0 / count(*), 2) AS average_order_value
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.channel = 'app'
      AND o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
  naive_sql: |
    SELECT round(avg(total_cents) / 100.0, 2)
    FROM warehouse.orders
    WHERE channel = 'app' AND extract(year FROM order_ts) = 2026

- id: app-share-net-revenue-fiscal-2026
  question: >-
    What share of fiscal year 2026 net revenue came from the app channel? Give a percentage to
    one decimal place.
  split: holdout
  category: ratios
  difficulty: 3
  metric_family: revenue
  numeric_tolerance: 0.1
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts]
  gold_sql: |
    SELECT round(100.0 * sum(o.subtotal_cents - o.discount_cents) FILTER (WHERE o.channel = 'app')
                 / sum(o.subtotal_cents - o.discount_cents), 1) AS app_share_percent
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
  naive_sql: |
    SELECT round(100.0 * sum(total_cents) FILTER (WHERE channel = 'app') / sum(total_cents), 1)
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2026
