# Benchmark, holdout split: 15 items, paraphrased away from dev (a test keeps every holdout
# question below the similarity threshold to every dev question). The analyzer team never reads
# these; the promotion gate scores them 3 times per version and an item passes on 2 of 3.

- id: average-list-price-active
  question: What is the mean list price of the products we currently sell, in dollars?
  split: holdout
  category: simple_aggregates
  difficulty: 1
  metric_family: products
  gold_sql: |
    SELECT round(avg(list_price_cents) / 100.0, 2) FROM warehouse.products WHERE is_active

- id: web-orders-calendar-2024
  question: Across the whole of calendar year 2024, what number of website orders came in?
  split: holdout
  category: simple_aggregates
  difficulty: 2
  metric_family: orders
  traps: [cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: channel-orders-calendar-year
  gold_sql: |
    SELECT count(*)
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.channel = 'web'
      AND o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2024-01-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-01-01'
  naive_sql: |
    SELECT count(*)
    FROM warehouse.orders
    WHERE channel = 'web' AND extract(year FROM order_ts) = 2024

- id: all-products-by-category
  question: >-
    Counting discontinued items as well, how big is the assortment of each top-level category?
    Show category name and product total.
  split: holdout
  category: joins_and_hierarchy
  difficulty: 2
  metric_family: products
  paraphrase_group: products-by-category
  gold_sql: |
    SELECT top.name AS category, count(*) AS products
    FROM warehouse.products p
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    GROUP BY top.name

- id: units-by-category-fiscal-2024
  question: Break down the quantity sold during fiscal year 2024 by top-level category.
  split: holdout
  category: joins_and_hierarchy
  difficulty: 3
  metric_family: products
  traps: [fiscal_year, cancelled_orders, internal_accounts]
  paraphrase_group: units-by-category
  gold_sql: |
    SELECT top.name AS category, sum(oi.quantity) AS units
    FROM warehouse.order_items oi
    JOIN warehouse.orders o ON o.order_id = oi.order_id
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    JOIN warehouse.products p ON p.product_id = oi.product_id
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2023-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2024-02-01'
    GROUP BY top.name
  naive_sql: |
    SELECT top.name, sum(oi.quantity)
    FROM warehouse.order_items oi
    JOIN warehouse.orders o ON o.order_id = oi.order_id
    JOIN warehouse.products p ON p.product_id = oi.product_id
    JOIN warehouse.categories sub ON sub.category_id = p.category_id
    JOIN warehouse.categories top ON top.category_id = sub.parent_id
    WHERE extract(year FROM o.order_ts) = 2024
    GROUP BY top.name

- id: net-revenue-fiscal-2026
  question: Report the total net revenue for fiscal year 2026 in dollars.
  split: holdout
  category: fiscal_periods
  difficulty: 2
  metric_family: revenue
  traps: [fiscal_year, net_revenue, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: net-revenue-fiscal-year
  gold_sql: |
    SELECT round(sum(o.subtotal_cents - o.discount_cents) / 100.0, 2) AS net_revenue
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
  naive_sql: |
    SELECT round(sum(total_cents) / 100.0, 2)
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2026

- id: orders-by-quarter-fiscal-2026
  question: >-
    Give me the order count for every quarter of fiscal year 2026, listed from the first
    quarter to the last.
  split: holdout
  category: fiscal_periods
  difficulty: 3
  metric_family: orders
  order_matters: true
  traps: [fiscal_year, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: by-fiscal-quarter
  gold_sql: |
    SELECT (extract(month FROM (o.order_ts AT TIME ZONE 'America/New_York') - interval '1 month')::int - 1) / 3 + 1 AS fiscal_quarter,
           count(*) AS orders
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2026-02-01'
    GROUP BY fiscal_quarter
    ORDER BY fiscal_quarter
  naive_sql: |
    SELECT extract(quarter FROM order_ts) AS quarter, count(*)
    FROM warehouse.orders
    WHERE extract(year FROM order_ts) = 2026
    GROUP BY quarter
    ORDER BY quarter

- id: buyers-first-quarter-fiscal-2026
  question: During the first quarter of fiscal year 2026, how many different shoppers bought something?
  split: holdout
  category: fiscal_periods
  difficulty: 3
  metric_family: customers
  traps: [fiscal_year, cancelled_orders, internal_accounts, eastern_time]
  paraphrase_group: distinct-buyers
  gold_sql: |
    SELECT count(DISTINCT o.customer_id)
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-02-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-05-01'
  naive_sql: |
    SELECT count(DISTINCT customer_id)
    FROM warehouse.orders
    WHERE order_ts >= '2026-01-01' AND order_ts < '2026-04-01'

- id: business-day-orders-november-2025
  question: Counting only working days, what was the order volume in November 2025?
  split: holdout
  category: eastern_business_days
  difficulty: 3
  metric_family: orders
  traps: [eastern_time, cancelled_orders, internal_accounts]
  paraphrase_group: business-day-orders
  gold_sql: |
    SELECT count(*)
    FROM warehouse.orders o
    JOIN warehouse.customers c ON c.customer_id = o.customer_id
    WHERE o.status <> 5
      AND lower(c.email) NOT LIKE '%@harborpine.com'
      AND (o.order_ts AT TIME ZONE 'America/New_York') >= DATE '2025-11-01'
      AND (o.order_ts AT TIME ZONE 'America/New_York') < DATE '2025-12-01'
      AND extract(isodow FROM (o.order_ts AT TIME ZONE 'America/New_York')) < 6
      AND (o.order_ts AT TIME ZONE 'America/New_York')::date <> DATE '2025-11-27'
  naive_sql: |
    SELECT count(*)
    FROM warehouse.orders
    WHERE order_ts >= '2025-11-01' AND order_ts < '2025-12-01'
      AND extract(isodow FROM order_ts) < 6

