# The single source for every live demo. `make docs` generates the demo tables and runbooks in
# section-*/demo/README.md, the cues in docs/instructor-guide.md, and the DEMO slide notes from it;
# `make demo NAME=<id>` and the console controls read it at run time.
# Schema: platform/src/datapilot/contracts/registries.py. Recovery for every demo is
# `make reset NAME=<section>`, then the same trigger again.
# `code` (files and lines shown in class) is filled in by each track once the code exists.
#
# The trigger contract: what each field names, and what checks it.
# - trigger.console: "<Page> > <control label>". Page is Agent, Verify, Events, or Improve, and the
#   label is the exact text of a control on that page, written as a string literal in
#   platform/console/screens/<page>.py; or "Status line > Kill switch (...)", the kill switch of
#   the status line component (datapilot_console/components/status_line.js). The unit test
#   test_every_registry_control_is_on_its_page (platform/tests/unit/test_console.py) fails when the
#   label is missing from its page. Two demos may share one control: Events > Send webhook question
#   sends the webhook question or, at the unattended level, the finale (api_client.webhook_demo).
#   The label is course text, read by the style and naming checks (test_registries.py).
# - trigger.make: exactly `make demo NAME=<id>`; the schema refuses any other value.
# - trigger.api: the request the console control and `make demo` both send, in one of the forms
#   datapilot.loop3_events.demos.trigger() dispatches on: "POST /events (<event type or the
#   same event_id three times>)", "POST /demo/<an endpoint in DEMO_POSTS>", "POST
#   /control/kill-switch", "POST /experiments/run ...", or "POST /analyzer/run ...". Any other
#   value fails `make demo` with "no trigger for ...". The same field names the events whose
#   planted flags the api accepts for the demo (demos.own_events). The integration test
#   test_console_api_contract.py presses each distinct (console, api) pair through the console's
#   own client against the real api app, and validates every request and reply against
#   datapilot.contracts.api.

# --- Section 1: Agent loop -------------------------------------------------------------------
- id: agent-simple-question
  section: agent-loop
  title: The simple question
  tier: core
  trigger:
    console: "Agent > Ask"
    make: "make demo NAME=agent-simple-question"
    api: "POST /events (question.asked)"
  planted: []
  guaranteed_moment: >-
    The analyst lists tables, describes one, runs one query, and returns an answer envelope with
    the SQL and the result; the tool timeline shows each call with its duration.
  expected_outcome: "A correct count with its SQL, tokens, cost, and a LangSmith link."
  can_vary: ["the analyst's wording", "number of tool calls", "latency", "tokens"]
  target_minutes: 3
  code:
    - {path: platform/src/datapilot/loop1_agent/analyst.py, lines: "72-86"}

