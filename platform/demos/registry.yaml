    and ends escalated with the reasons.
  expected_outcome: "The cost counter stops at the cap and the run shows escalated."
  can_vary: ["cost per attempt", "the agent's retries' SQL"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop2_verification/loop.py, lines: "369-374"}

