  target_minutes: 5
  code:
    - {path: platform/src/datapilot/loop1_agent/analyst.py, lines: "56-58"}

- id: agent-unbounded-rows
  section: agent-loop
  title: Unbounded rows
  tier: core
  trigger:
    console: "Agent > Run large query"
    make: "make demo NAME=agent-unbounded-rows"
    api: "POST /demo/large-query"
  planted: [BUG_UNBOUNDED_ROWS]
  guaranteed_moment: >-
    With the unbounded rows bug on, a 10,000-row SELECT goes through run_query and a list question
    follows; the token counter spikes. With it off, the same steps return at most the row cap, the
    total count, and a truncation notice.
  expected_outcome: "Tokens per run jump with the bug on and drop back with it off."
  can_vary: ["exact token counts", "the list question's wording", "whether the run with the bug off ends held for approval by a reviewer concern; the token counter is the moment either way"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop1_agent/tools.py, lines: "33-54"}

# --- Section 2: Verification loop ------------------------------------------------------------
- id: verify-malicious-sql
  section: verification-loop
  title: Malicious SQL
  tier: core
  trigger:
    console: "Verify > Send malicious SQL"
    make: "make demo NAME=verify-malicious-sql"
    api: "POST /demo/malicious-sql"
  planted: [BUG_NAIVE_GUARD]
  guaranteed_moment: >-
    With the naive guard, "SELECT 1; DELETE FROM orders" and a data-modifying CTE pass the guard and
    the read-only role refuses them (SQLSTATE 25006); with the syntax-tree guard, layer 2 rejects
    them before execution. A raw DELETE as the agent role is refused by the role.
  expected_outcome: "The defense-layer panel shows which layer stopped each statement; no warehouse row changes."
  can_vary: ["nothing in the outcome; timings only"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop2_verification/checker.py, lines: "85-101"}
    - {path: platform/src/datapilot/loop2_verification/graders/statement_policy.py, lines: "84-95"}

- id: verify-cost-guard
  section: verification-loop
  title: The cost guard
  tier: optional
  trigger:
    console: "Verify > Send cartesian query"
    make: "make demo NAME=verify-cost-guard"
    api: "POST /demo/cartesian-query"
  planted: [BUG_NO_COST_GUARD]
  guaranteed_moment: >-
    With the missing cost guard, a cartesian join runs until the statement timeout; with the cost
    grader, EXPLAIN rejects it at once with feedback for the agent.
  expected_outcome: "A timeout with the bug on; an instant rejection with its reason with it off."
  can_vary: ["the EXPLAIN cost figure", "timings"]
  target_minutes: 3
  code:
    - {path: platform/src/datapilot/loop2_verification/checker.py, lines: "85-101"}

- id: verify-retry-cap
  section: verification-loop
  title: The retry cap
  tier: core
  trigger:
    console: "Verify > Inject failing grader"
    make: "make demo NAME=verify-retry-cap"
    api: "POST /demo/failing-grader"
  planted: [BUG_NO_RETRY_CAP, failing-grader-injection]
  guaranteed_moment: >-
    An injected grader that always fails sends the run back to the agent; with the missing retry
    cap the run keeps looping and the cost counter climbs; with the cap it stops after 3 attempts
    and ends escalated with the reasons.
  expected_outcome: "The cost counter stops at the cap and the run shows escalated."
  can_vary: ["cost per attempt", "the agent's retries' SQL"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop2_verification/loop.py, lines: "364-369"}

