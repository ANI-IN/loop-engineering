- id: events-kill-switch-in-flight
  section: event-loop
  title: The kill switch in flight
  tier: core
  trigger:
    console: "Status line > Kill switch (arm, then stop)"
    make: "make demo NAME=events-kill-switch-in-flight"
    api: "POST /control/kill-switch"
  planted: [BUG_KILLSWITCH_AT_CLAIM_ONLY, DEMO_PACING]
  guaranteed_moment: >-
    `make demo` sends the webhook question with demo pacing on for that run, and engages the kill
    switch while it is in flight. With the kill switch at claim only (the planted half, `make demo
    NAME=events-kill-switch-in-flight PLANTED=1`), the run keeps going; with the check before every
    model and tool call, it stops at its next step as blocked by kill switch and the system is held
    at the report-only level. Each half ends with the switch engaged, and an engaged switch blocks
    the next run at claim: `make reset NAME=event-loop` after each half, so nothing later is
    blocked.
  expected_outcome: "The in-flight strip moves to Blocked by kill switch; the status line shows the report-only level."
  can_vary: ["which step the run stops at"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop3_events/killswitch.py, lines: "89-95"}

# --- Section 4: Hill-climbing loop -----------------------------------------------------------
- id: improve-baseline-experiment
  section: hill-climbing-loop
  title: The baseline experiment
  tier: core
  trigger:
    console: "Improve > Run experiment on the active version"
    make: "make demo NAME=improve-baseline-experiment"
    api: "POST /experiments/run"
  planted: [knowledge-v1-empty, data-traps]
  guaranteed_moment: >-
    Started at the poll, the experiment runs the 40 benchmark questions under version 1 of the knowledge
    (the starting version);
    the trap questions fail and the holdout ledger fills in locally, each row stamped with its run's
    start time and linked to its LangSmith trace when the trace sample took one of its runs (about
    1 run in 5), otherwise marked "Not traced". This run is the session's baseline.
  expected_outcome: "The number of holdout questions version 1 passes, with the trap questions failed."
  can_vary: ["which non-trap questions pass", "wall time"]
  target_minutes: 3
  code:
    - {path: platform/src/datapilot/loop4_hill_climbing/experiment.py, lines: "192-194"}

- id: improve-naive-analyzer-blocked
  section: hill-climbing-loop
  title: The naive analyzer, blocked
  tier: core
  trigger:
    console: "Improve > Run the naive analyzer (planted)"
    make: "make demo NAME=improve-naive-analyzer-blocked"
    api: "POST /analyzer/run, then POST /experiments/run (the candidate)"
  planted: [BUG_NAIVE_ANALYZER]
  guaranteed_moment: >-
    Two requests, queued together at the break with `make demo
    NAME=improve-naive-analyzer-blocked PLANTED=1`: the analyzer, then the candidate experiment;
    the runner takes them in that order, after the baseline. Its planted half is its only half, so
    the command switches the naive analyzer on for its own two requests with or without
    PLANTED=1. The console's Improve page queues the
    same two requests with the same flag from its Run the naive analyzer (planted) button, shown
    only while demo controls are allowed; its Run analyzer button runs the analyzer team, never
    the naive analyzer. The naive analyzer, with no model call, writes
    one rule per failed development question, quoting it word for word with the analyst's query that
    failed, and never reads a gold query. It skips the critic and applies no overfit guard:
    the guard flags every rule and the Improve page says so, yet the knowledge diff keeps them all.
    Then the candidate experiment runs, and the gate blocks the version because the overfit guard
    rejects its rules, whatever its holdout count.
  expected_outcome: >-
    The overfit guard flags every rule, not applied by the analyzer; the gate verdict reads
    blocked, naming the rules the overfit guard rejects.
  can_vary: ["how many development questions failed", "how many development questions pass", "how many holdout questions pass", "the time from the trigger to the verdict (211 to 580 seconds in 6 measured runs; the longest on a machine shared with assignment checks)"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop4_hill_climbing/analyzer.py, lines: "206-210"}
    - {path: platform/src/datapilot/loop4_hill_climbing/gate.py, lines: "119-137"}

