# The single source for every live demo. `make docs` generates the demo tables and runbooks in
# section-*/demo/README.md, the cues in docs/instructor-guide.md, and the DEMO slide notes from it;
# `make demo NAME=<id>` and the console controls read it at run time.
# Schema: platform/src/datapilot/contracts/registries.py. Recovery for every demo is
# `make reset NAME=<section>`, then the same trigger again.
# `code` (files and lines shown in class) is filled in by each track once the code exists.

# --- Section 1: Agent loop -------------------------------------------------------------------
- id: agent-simple-question
  section: agent-loop
  title: The simple question
  tier: core
  trigger:
    console: "Agent > Ask"
    make: "make demo NAME=agent-simple-question"
    api: "POST /events (question.asked)"
  planted: []
  guaranteed_moment: >-
    The analyst lists tables, describes one, runs one query, and returns an answer envelope with
    the SQL and the result; the tool timeline shows each call with its duration.
  expected_outcome: "A correct count with its SQL, tokens, cost, and a LangSmith link."
  can_vary: ["the analyst's wording", "number of tool calls", "latency", "tokens"]
  target_minutes: 3
  code:
    - {path: platform/src/datapilot/loop1_agent/analyst.py, lines: "72-86"}

- id: agent-texas-last-quarter
  section: agent-loop
  title: Texas last quarter
  tier: optional
  trigger:
    console: "Agent > Ask"
    make: "make demo NAME=agent-texas-last-quarter"
    api: "POST /events (question.asked)"
  planted: []
  guaranteed_moment: >-
    A multi-join question across orders, order items, products, and categories for customers in
    Texas over the last completed fiscal quarter (August to October 2025, against the business
    date of 31 January 2026), with the join path visible in the SQL.
  expected_outcome: >-
    An answer whose SQL joins four tables. No benchmark item asks this question, so the run gets no
    gold check; the date range in the SQL shows whether the fiscal-quarter trap is hit.
  can_vary: ["join order", "whether the fiscal-quarter trap is hit", "latency"]
  target_minutes: 4
  code:
    - {path: platform/src/datapilot/loop1_agent/analyst.py, lines: "72-86"}

- id: agent-confident-wrong-answer
  section: agent-loop
  title: The confident wrong answer
  tier: core
  trigger:
    console: "Agent > Ask the spine question"
    make: "make demo NAME=agent-confident-wrong-answer"
    api: "POST /events (question.asked)"
  planted: [knowledge-v1-empty, total-cents-column, undocumented-status, data-traps]
  guaranteed_moment: >-
    Under knowledge version v1, the spine question "What was our net revenue in fiscal year 2025?"
    gets a confident, wrong answer; the answer-versus-gold ledger shows the mismatch and the
    annotated SQL names each trap behind the wrong fragments.
  expected_outcome: "A mismatch against gold with at least one trap annotation on the SQL."
  can_vary:
    - "which traps the SQL hits"
    - "the wrong value"
    - "wording"
    - "held for approval by a reviewer concern (leave it held: the gold check still shows)"
