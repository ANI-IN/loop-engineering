  tier: core
  trigger:
    console: "Verify > Inject failing grader"
    make: "make demo NAME=verify-retry-cap"
    api: "POST /demo/failing-grader"
  planted: [BUG_NO_RETRY_CAP, failing-grader-injection]
  guaranteed_moment: >-
    An injected grader that always fails sends the run back to the agent; with the missing retry
