- id: improve-analyzer-team-approve
  section: hill-climbing-loop
  title: The analyzer team and approval
  tier: core
  trigger:
    console: "Improve > Run analyzer"
    make: "make demo NAME=improve-analyzer-team-approve"
    api: "POST /analyzer/run"
  planted: []
  guaranteed_moment: >-
    The failure analyst diagnoses the failed dev items, the rule writer proposes general rules, the
    critic keeps, narrows, or drops each one, a rule whose SQL guidance does not run over the schema
    is dropped, and the overfit guard rejects any rule that quotes a benchmark question or copies
    gold SQL and passes the rest. The team writes two candidates this way, each runs on the dev
    split only, and the Improve page names the one kept by its dev results; the knowledge diff
    shows it for human approval.
  expected_outcome: "A candidate version with general rules in the diff viewer, and the line naming both candidates and the one kept."
  can_vary: ["rule wording", "number of rules", "which candidate is kept", "which rules, if any, the overfit guard rejects (live, it rejected a critic-kept rule that copied 20 or more tokens of a gold query)", "wall time: 326 and 377 s with two candidates in the two measured runs"]
  target_minutes: 6
  code:
    - {path: platform/src/datapilot/loop4_hill_climbing/analyzer.py, lines: "242-245"}

- id: improve-candidate-experiment
  section: hill-climbing-loop
  title: The candidate experiment
  tier: core
  trigger:
    console: "Improve > Run experiment on the candidate"
    make: "make demo NAME=improve-candidate-experiment"
    api: "POST /experiments/run"
  planted: []
  guaranteed_moment: >-
    The candidate version flips holdout trap items with zero regressions on either split. The live
    holdout ledger in the console, scored locally against this session's
    baseline, marks the flips; then the LangSmith trace list of datapilot-experiments, filtered by
    knowledge version, shows the candidate's traced runs, a sample of about 1 run in 5. The gate
    passes once approved; the runner then makes the version active and runs the clearance
    re-runs (50 seconds after the approval, measured once). In class it is queued at once after
    the analyzer (Improve > Run analyzer, then Improve > Run experiment on the candidate); trigger
    it again only if it never started, since a second press queues a second experiment.
  expected_outcome: "Holdout flips marked against this session's baseline, no regressions, gate verdict passed."
  can_vary: ["which items flip", "how many flip: 0 to 12 of 13 holdout trap items in the measured runs, a majority in 6 of 10, so check the candidate in rehearsal", "wall time: 182 to 459 s; confirming re-runs of an apparent regression lengthen it"]
  target_minutes: 5
  code:
    - {path: platform/src/datapilot/loop4_hill_climbing/experiment.py, lines: "192-194"}
    - {path: platform/src/datapilot/loop4_hill_climbing/gate.py, lines: "117-135"}

- id: improve-cleared-unattended
  section: hill-climbing-loop
  title: Cleared for the unattended level
  tier: core
  trigger:
    console: "Events > Send webhook question"
    make: "make demo NAME=improve-cleared-unattended"
    api: "POST /events (question.asked)"
  planted: []
  guaranteed_moment: >-
    The correct answer, posted at the level its family has earned. Before it, the Improve page says
    the approved version is the active version, and the system is set to the unattended level (Improve > Set
    the unattended level, or `make autonomy LEVEL=unattended BY="<your name>"`); the trigger
    refuses, saying which step is missing, while a promotion is pending, the kill switch is
    engaged, or the level is lower. The spine question arrives as a
    webhook and is answered correctly under the new active version; it posts at the unattended
    level when the promotion cleared its metric family on the gate's own confirmed standard (every
    holdout item at 2 of 3 runs, an item that fell short passing 2 of 3 more runs), and at the
    assisted level when the family fell short. From the promotion on, Events > Send webhook
    question sends this spine question whether a family cleared or none did. Its strip on the
    Events page then shows the gold check the runner writes after the post: "Gold check passed",
    or "Gold check failed" with the agent's value and the gold value, the class-day safeguard's
    trigger.
  expected_outcome: >-
    A correct answer, posted at the unattended level if its family cleared on the confirmed
    standard, and at the assisted level if it did not.
  can_vary: ["wording", "latency", "the level: assisted or unattended; the answer is correct either way"]
  target_minutes: 3
  code:
    - {path: platform/src/datapilot/loop4_hill_climbing/eligibility.py, lines: "72-80"}
