# The public release: only the paths in `include` ship, built from the private repository.
# Add every new public folder here. platform/tests/unit/test_release_list.py fails when a top-level
# folder is in neither list, when the style checker or the prose lint does not scan it, or when a
# shipped Markdown file is neither a course page nor listed in `other_markdown`.
include = [
    "README.md",
    "LICENSE",
    "SECURITY.md",
    "compose.yaml",
    ".gitattributes",
    ".dockerignore",
    "Makefile",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    ".pymarkdown.yaml",  # the Markdown lint's configuration, read by CI
    ".env.example",
    ".gitignore",
    ".github/",
    "setup/",
    "section-*/",
    "final-project/",
    "slides/",
    "use-in-your-repo/",
    "guide/",
    "docs/",
    "platform/",
]
# Private tooling and its tests never ship. A test that names a private path writes it as a
# string literal, so the release build can find and drop that test too.
exclude = [
    "instructor/",
    "course-template/",
    ".claude/",
    ".dev/",
    # Runtime output (gitignored): calibration's raw results and run log, seed files.
    ".runs/",
    "research/",
    # Published separately, at the start of the Thursday review (docs/release-checklist.md); the
    # owner's release with --with-solutions ships them (platform/scripts/build_release.py).
    "section-*/assignment/solution/",
    # The class deck's build: the owner builds the deck from the outline and hands it out
    # separately. No learner page uses the template, its fonts and pictures, the deck scripts, or
    # the program's slide templates; the outline and its sources (slides/source/) ship.
    "slides/template.pptx",
    "slides/assets/",
    "slides/scripts/",
    "slides/source/build_deck.py",
    "slides/tests/test_build_deck.py",
    "slides/tests/test_deck_diagrams.py",  # checks the deck's diagram exports in slides/assets/
    "slides/outline-template.md",
    "slides/slide-review.md",
    # The guide kit's template configuration (placeholders); guide/guide.json is this guide's.
    "guide/source/guide.example.json",
    # The session notes recap the class run, so they cannot be written before it; until then each
    # holds only its outline, and a page that describes what it will hold never ships (the
    # placeholder check in platform/scripts/build_release.py). They ship in the first release
    # after the class, once written: delete this entry then, and link them again from each
    # section's README and reading list and from docs/start-here.md.
    "section-*/session-notes.md",
]
# Files withheld only until they are written or published: a shipped page may name one (the
# instructor guide's after-class steps, the style guide's page rules), though never link to it.
withheld_until_later = ["section-*/session-notes.md"]
# The withheld solutions: an `exclude` entry and a `public_gitignore` line until the owner's
# release with --with-solutions, at the start of the Thursday review, publishes them.
solutions = "section-*/assignment/solution/"
# Internal files that may sit anywhere in the tree (a nested copy too) and never ship.
internal_files = ["PLAN.md", "DECISIONS.md", "CLAUDE.md"]
# Build tooling for this machine's agents, never shipped (it names the build machine's checkout).
# The repository guards also read this list: a checkout that holds one of these files is the
# course's build, where the sole-author and commit-message rules apply.
build_only = ["platform/scripts/wsl_make.sh"]
# Patterns no shipped file may match: a link into a LangSmith organization (the build's traces are
# private; placeholders such as /o/example or /o/{TENANT} in tests do not match). A release into a
# clone of main also reads every commit already published for them and for the --deny words.
deny_patterns = ['smith\.langchain\.com/o/[0-9a-f]{8}-[0-9a-f]{4}-']
# Host-path patterns in public files that are documented examples, not real paths: a placeholder
# name, the fake user `x` in tests, and the container's own user.
host_path_examples = ['<[a-z]+>', '/Users/x(/|$)', '/home/datapilot/']
# The public repository's .gitignore also ignores these, so a learner's copy of the Thursday
# solutions is never committed by accident. Appended as its own block, with its comment.
public_gitignore = [
    "# Assignment solutions: published at the start of the Thursday review; never commit your own copy.",
    "section-*/assignment/solution/",
]
# .gitignore lines only the private build needs (its working notes and the agent worktrees): the
# public .gitignore leaves them out, with their comments.
build_only_gitignore = [".dev/", ".claude/worktrees/"]
# Public folders whose Markdown pages are course text: the checkers must scan each one.
pages = ["setup", "section-*", "final-project", "use-in-your-repo", "guide", "docs"]
# Shipped Markdown that is not a course page, so the style checker does not read it: the naming
# rule (short forms and shorthand) reads each one instead, in platform/tests/unit/test_release_list.py.
other_markdown = [
    "SECURITY.md",  # the security policy, shown by GitHub
    "slides/outline.md",  # generated from slides/source/; also read by `make check-names`
    "slides/design-system.md",  # the deck's design system and the schema of slides/source/
    "platform/README.md",  # the map of the platform folder
    "platform/console/DESIGN.md",  # the console's design notes
    "platform/packs/_template/README.md",  # the domain pack template
    "platform/packs/*/benchmark/business_rules.md",  # a pack's business rules, read by the agent
    "platform/scripts/kit/*/README.md",  # the course kit's tools
]

# Published commits whose findings in the history check are known and do not fail a release, each
# with its reason. Whether to rewrite such a commit is the course owner's decision.
[accepted_history]
"a0a23d9b27a4586c4aab2888b360cf398886b294" = "the first release, 23 October 2026, published before the deny patterns existed"

# Legitimate uses of what the placeholder check refuses (platform/scripts/build_release.py,
# PLACEHOLDER_RULES): each names a shipped file (a glob), the rules it may break, and why. An entry
# that no longer matches anything fails platform/tests/unit/test_release_list.py, so the list
# never outlives its reason.
[[placeholder_allow]]
path = "platform/config/release.toml"
rules = ["lorem ipsum"]
why = "this list names the rule each entry allows"

[[placeholder_allow]]
path = "platform/scripts/build_release.py"
rules = ["a leftover marker", "lorem ipsum", "template guidance"]
why = "the placeholder check itself names the markers it refuses"

[[placeholder_allow]]
path = "platform/scripts/check_style.py"
rules = ["a leftover marker"]
why = "the style checker's leftover-marker rule names the markers it refuses"

[[placeholder_allow]]
path = "platform/scripts/kit/scan/*"
rules = ["a leftover marker", "lorem ipsum"]
why = "the scan kit's PDF check and its README name the markers it refuses"

[[placeholder_allow]]
path = "platform/scripts/kit/style/README.md"
rules = ["a leftover marker"]
why = "the style kit's README states the no-leftovers rule"
