name: CI

# The offline suite only: zero network, zero API keys, zero cost. That is a property
# of the suite rather than a CI trick — `addopts = -m 'not live'` deselects everything
# that touches the network, so this runs free on every push and cannot be broken by a
# missing secret.
on:
  push:
  pull_request:

# Read-only by default. Without this block GitHub grants the job the default
# token scope, which on a public repository with a `pull_request` trigger is far
# more than a test run needs. Nothing here writes to the repository, so nothing
# here needs permission to.
#
# A job that does need more should widen it at the job level, visibly, rather
# than inheriting it from an absent declaration.
permissions:
  contents: read

# A push to a branch with an open PR triggers this workflow twice, and the two
# runs are identical. Cancelling the superseded one stops a queue of stale runs
# from being the reason a real failure is noticed late.
#
# Keyed on the ref, so runs on different branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    # Raised from 10. A run was cancelled here at 10m18s and the cancellation told
    # nobody which test was stuck. The real fix is the per-test timeout in
    # pyproject.toml, which fails the run with a traceback naming the test; this
    # ceiling is now only a backstop against the whole job wedging.
    timeout-minutes: 20

    env:
      # matplotlib rebuilds its font cache on first import, which costs real time on
      # a cold runner. Pointed at a cached directory so it is paid once.
      MPLCONFIGDIR: ${{ github.workspace }}/.mplcache

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache the matplotlib font cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mplcache
          key: mplcache-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Lint
        run: uv run ruff check .

      - name: Numeric-literal rule
        # Bans typed numbers in the modules that render to a projector. A typed
        # number is indistinguishable from a measured one once it is on screen.
        # Also fails when a declared target does not resolve — a rule pointing at a
        # missing path passes while enforcing nothing.
        run: uv run python tools/lint_no_numbers.py

      - name: A checkout with only the two model keys can start
        # THE check whose absence let a required LANGSMITH_API_KEY ship green. README §10
        # promised LangSmith was optional; settings.py declared it required; every passing
        # test in tests/test_settings.py set every key, so nothing exercised the journey a
        # first-time cloner actually takes.
        #
        # Dummy values, and no network. This must never need a real key — it runs in the
        # offline job on purpose, because that is where the property belongs.
        env:
          OPENAI_API_KEY: ci-dummy-not-a-real-key
          ANTHROPIC_API_KEY: ci-dummy-not-a-real-key
        run: |
          uv run python -c "
          from loopeng.settings import load_settings
          s = load_settings()
          assert s.langsmith_api_key is None, 'LANGSMITH_API_KEY leaked in from somewhere'
          print('settings load with the two model keys alone')"

      - name: Offline test suite
        # No ANTHROPIC_API_KEY is set anywhere in this job, on purpose. If a test ever
        # starts needing one, this fails and that is the correct outcome.
        #
        # -p no:randomly and --durations make a slow or hung run diagnosable from the
        # log alone, which the cancelled run was not.
        run: uv run pytest -q --durations=15

      - name: Confirm live tests were deselected, not skipped silently
        run: |
          uv run pytest --collect-only -q -m live 2>&1 | tail -3

