name: ci

# Zero-token checks only. Live tests (OpenAI, LangSmith) never run in CI: no API keys are stored as
# secrets; run them locally with the live make targets. Every check is a plain run: step (tools
# pinned in uv.lock, Docker images pinned by tag and digest), so platform/scripts/ci_local.py
# replays this workflow exactly. External links are checked weekly in links.yml, never here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Python and course text: lint, format, import rules, prose, style, naming, guards, generated
  # pages, and the secret scan over every commit.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0  # the naming-rule check and the history secret scan read every commit
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run python platform/scripts/lint_prose.py
      # Strict: a warning fails as an error does. Strict style is the release gate, and the release
      # build runs the same check on the public tree (platform/scripts/build_release.py).
      - name: course style check, strict
        run: uv run python platform/scripts/check_style.py --strict
      # In a public copy the guards refuse a core.worktree setting and a tracked .env; the
      # configuration allow-list, the sole-author rule, and the co-author rule belong to the
      # course's build and are skipped, so a learner's own git settings and commits pass.
      - name: repository guards (no core.worktree, no tracked .env)
        run: uv run python platform/scripts/check_repo_guards.py
      - name: naming rule on the course pages, strict
        run: uv run python platform/scripts/check_style.py --names-only --strict
      - name: naming rule on the slide outline
        run: uv run python platform/scripts/short_forms.py slides/outline.md
      # Read by the guards script, which fails when git fails (no pipe), and skipped in a public
      # copy, where the commit messages are a learner's own.
      - name: naming rule on commit messages (the course's build only)
        shell: bash
        run: uv run python platform/scripts/check_repo_guards.py --commit-messages
      - name: generated pages up to date
        run: uv run python platform/tools/generators/render.py --check
      - name: secrets in every file and every commit (the course's key patterns)
        run: uv run python platform/scripts/check_repo_files.py --history secrets

  # Every Markdown page: the Markdown linter, relative links and anchors, the slide outline, the
  # images, and the diagram exports against their sources.
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: Markdown linter (pymarkdownlnt, .pymarkdown.yaml)
        run: uv run python platform/scripts/lint_markdown.py
      - name: every relative link and anchor resolves
        run: uv run python platform/scripts/check_links.py
      - name: the slide outline is up to date with its sources
        run: uv run python platform/scripts/check_outline.py
      - name: diagram sources parse; their SVG and PNG exports are the recorded renders
        run: uv run python platform/tools/diagrams/export_diagrams.py --check
      - name: images (size, clipping, blank areas, alt text)
        run: uv run python platform/scripts/check_images.py

  # Every other published file: data files and schemas, make targets named on pages, course
  # structure, shell scripts, the workflows, the Dockerfile, Compose, and gitleaks.
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      # Before uv sync, so the scan reads the checkout and nothing installed into it.
      - name: secret scan (gitleaks 8.30.1)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/platform/config/gitleaks.toml --no-banner --redact --exit-code 1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - name: YAML, TOML and JSON parse; the pack, registries and benchmark match their schemas; course structure
        run: uv run python platform/scripts/check_repo_files.py data schemas structure
      - name: every make target named on a page exists (make -n)
        run: uv run python platform/scripts/check_repo_files.py make-targets
      - name: ShellCheck on every shell script
        run: uv run python platform/scripts/check_shell_docker.py shellcheck
      - name: bash -n on every shell script
        run: uv run python platform/scripts/check_shell_docker.py bash-n
      - name: actionlint on every workflow
        run: uv run actionlint
      - name: hadolint on every Dockerfile
        run: uv run python platform/scripts/check_shell_docker.py hadolint
      - name: docker compose config for every profile
        run: uv run python platform/scripts/check_shell_docker.py compose

  # The release rules on the tree CI checks out: no internal files, no solutions, no LangSmith
  # organisation links, no key-like text or host paths, no placeholder but the allowed ones.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python platform/scripts/check_repo_files.py release

  # The images build, with no secret and no .env.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python platform/scripts/check_shell_docker.py build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q -m "not integration and not live"

  # Every migration applied in order to a fresh PostgreSQL 18.6 and both warehouses seeded
  # (platform/scripts/prepare_tests_database.py), then the integration tests.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v6.7.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen
      # The tests' own database (Compose project datapilot-tests, port 55432), as make test-integration
      - run: POSTGRES_PORT=55432 docker compose -p datapilot-tests up --detach --wait postgres
      - run: DATAPILOT_TEST_POSTGRES_PORT=55432 uv run python platform/scripts/prepare_tests_database.py
      - run: DATAPILOT_TEST_POSTGRES_PORT=55432 uv run pytest -q -m integration
